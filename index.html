
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Todo App</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f4f5f7;
      color: #222;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 50px 20px;
    }

    .todo-app {
      width: 100%;
      max-width: 600px;
      background: #fff;
      padding: 30px;
      border-radius: 14px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
    }

    h1 {
      margin-bottom: 25px;
      font-size: 30px;
    }

    .input-row {
      display: flex;
      gap: 10px;
      margin-bottom: 25px;
    }

    #todoInput {
      flex: 1;
      padding: 13px 15px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 16px;
      outline: none;
    }

    #todoInput:focus {
      border-color: #555;
    }

    button {
      border: none;
      cursor: pointer;
      border-radius: 8px;
    }

    .add-btn {
      padding: 0 20px;
      background: #222;
      color: #fff;
      font-size: 15px;
    }

    .add-btn:hover {
      background: #444;
    }

    .filters {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
    }

    .filter-btn {
      padding: 8px 14px;
      background: #eee;
      color: #333;
    }

    .filter-btn.active {
      background: #222;
      color: #fff;
    }

    #todoList {
      list-style: none;
    }

    .todo-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 0;
      border-bottom: 1px solid #eee;
    }

    .todo-item input[type="checkbox"] {
      width: 18px;
      height: 18px;
      cursor: pointer;
    }

    .todo-text {
      flex: 1;
      font-size: 16px;
      word-break: break-word;
    }

    .todo-item.completed .todo-text {
      text-decoration: line-through;
      color: #999;
    }

    .delete-btn {
      background: transparent;
      color: #d33;
      font-size: 14px;
      padding: 5px;
    }

    .delete-btn:hover {
      color: #a00;
    }

    .empty {
      text-align: center;
      color: #999;
      padding: 30px 0;
    }

    .footer {
      margin-top: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: #777;
      font-size: 14px;
    }

    .clear-btn {
      background: transparent;
      color: #d33;
      font-size: 14px;
    }

    @media (max-width: 500px) {
      .todo-app {
        padding: 20px;
      }

      .input-row {
        flex-direction: column;
      }

      .add-btn {
        padding: 12px;
      }
    }
  </style>
</head>

<body>

  <div class="todo-app">
    <h1>My Todo List</h1>

    <div class="input-row">
      <input
        type="text"
        id="todoInput"
        placeholder="What needs to be done?"
      >
      <button class="add-btn" onclick="addTodo()">Add</button>
    </div>

    <div class="filters">
      <button class="filter-btn active" onclick="setFilter('all', this)">
        All
      </button>
      <button class="filter-btn" onclick="setFilter('active', this)">
        Active
      </button>
      <button class="filter-btn" onclick="setFilter('completed', this)">
        Completed
      </button>
    </div>

    <ul id="todoList"></ul>

    <div class="footer">
      <span id="todoCount">0 tasks</span>
      <button class="clear-btn" onclick="clearCompleted()">
        Clear completed
      </button>
    </div>
  </div>

  <script>
    let todos = JSON.parse(localStorage.getItem("todos")) || [];
    let currentFilter = "all";

    const input = document.getElementById("todoInput");
    const list = document.getElementById("todoList");
    const count = document.getElementById("todoCount");

    function saveTodos() {
      localStorage.setItem("todos", JSON.stringify(todos));
    }

    function addTodo() {
      const text = input.value.trim();

      if (!text) return;

      todos.push({
        id: Date.now(),
        text: text,
        completed: false
      });

      input.value = "";
      saveTodos();
      renderTodos();
    }

    input.addEventListener("keydown", function(event) {
      if (event.key === "Enter") {
        addTodo();
      }
    });

    function toggleTodo(id) {
      todos = todos.map(todo =>
        todo.id === id
          ? { ...todo, completed: !todo.completed }
          : todo
      );

      saveTodos();
      renderTodos();
    }

    function deleteTodo(id) {
      todos = todos.filter(todo => todo.id !== id);

      saveTodos();
      renderTodos();
    }

    function clearCompleted() {
      todos = todos.filter(todo => !todo.completed);

      saveTodos();
      renderTodos();
    }

    function setFilter(filter, button) {
      currentFilter = filter;

      document.querySelectorAll(".filter-btn").forEach(btn => {
        btn.classList.remove("active");
      });

      button.classList.add("active");

      renderTodos();
    }

    function renderTodos() {
      list.innerHTML = "";

      let filteredTodos = todos;

      if (currentFilter === "active") {
        filteredTodos = todos.filter(todo => !todo.completed);
      }

      if (currentFilter === "completed") {
        filteredTodos = todos.filter(todo => todo.completed);
      }

      if (filteredTodos.length === 0) {
        list.innerHTML = '<li class="empty">No tasks found.</li>';
      } else {
        filteredTodos.forEach(todo => {
          const li = document.createElement("li");
          li.className = "todo-item";

          if (todo.completed) {
            li.classList.add("completed");
          }

          li.innerHTML = `
            <input
              type="checkbox"
              ${todo.completed ? "checked" : ""}
              onchange="toggleTodo(${todo.id})"
            >

            <span class="todo-text">${escapeHTML(todo.text)}</span>

            <button
              class="delete-btn"
              onclick="deleteTodo(${todo.id})"
            >
              Delete
            </button>
          `;

          list.appendChild(li);
        });
      }

      const activeCount = todos.filter(todo => !todo.completed).length;
      count.textContent =
        activeCount === 1
          ? "1 task remaining"
          : `${activeCount} tasks remaining`;
    }

    function escapeHTML(text) {
      const div = document.createElement("div");
      div.textContent = text;
      return div.innerHTML;
    }

    renderTodos();
  </script>

</body>
</html>
