<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Todo App</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #f6f7fb;
      --bg-accent: radial-gradient(1200px 600px at 15% -10%, #dfe7ff 0%, transparent 60%),
                   radial-gradient(900px 500px at 100% 0%, #ffe3f1 0%, transparent 55%);
      --card: rgba(255, 255, 255, 0.78);
      --card-border: rgba(17, 24, 39, 0.08);
      --text: #10131a;
      --text-soft: #6b7280;
      --text-faint: #9ca3af;
      --line: rgba(17, 24, 39, 0.07);
      --field: rgba(255, 255, 255, 0.9);
      --chip: rgba(17, 24, 39, 0.05);
      --chip-hover: rgba(17, 24, 39, 0.09);
      --accent: #5b5bd6;
      --accent-2: #8b5cf6;
      --accent-soft: rgba(91, 91, 214, 0.12);
      --danger: #e11d48;
      --danger-soft: rgba(225, 29, 72, 0.1);
      --shadow: 0 20px 50px -20px rgba(17, 24, 39, 0.28), 0 2px 8px rgba(17, 24, 39, 0.04);
      --radius: 20px;
    }

    :root[data-theme="dark"] {
      --bg: #0b0d12;
      --bg-accent: radial-gradient(1200px 600px at 15% -10%, #1c2450 0%, transparent 60%),
                   radial-gradient(900px 500px at 100% 0%, #3a1d3f 0%, transparent 55%);
      --card: rgba(23, 26, 35, 0.72);
      --card-border: rgba(255, 255, 255, 0.09);
      --text: #eef1f7;
      --text-soft: #9aa3b2;
      --text-faint: #6b7280;
      --line: rgba(255, 255, 255, 0.07);
      --field: rgba(255, 255, 255, 0.05);
      --chip: rgba(255, 255, 255, 0.07);
      --chip-hover: rgba(255, 255, 255, 0.12);
      --accent: #8b8bf5;
      --accent-2: #c084fc;
      --accent-soft: rgba(139, 139, 245, 0.16);
      --danger: #fb7185;
      --danger-soft: rgba(251, 113, 133, 0.14);
      --shadow: 0 24px 60px -20px rgba(0, 0, 0, 0.7), 0 2px 8px rgba(0, 0, 0, 0.3);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background-color: var(--bg);
      background-image: var(--bg-accent);
      background-attachment: fixed;
      color: var(--text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 64px 20px;
      -webkit-font-smoothing: antialiased;
      transition: background-color .3s ease, color .3s ease;
    }

    .todo-app {
      width: 100%;
      max-width: 620px;
      background: var(--card);
      backdrop-filter: blur(24px) saturate(160%);
      -webkit-backdrop-filter: blur(24px) saturate(160%);
      border: 1px solid var(--card-border);
      padding: 34px 32px 28px;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      animation: rise .5s cubic-bezier(.22, 1, .36, 1) both;
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: none; }
    }

    .head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 26px;
    }

    h1 {
      font-size: 30px;
      font-weight: 700;
      letter-spacing: -0.025em;
      background: linear-gradient(120deg, var(--accent), var(--accent-2));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .subtitle {
      margin-top: 6px;
      font-size: 14px;
      color: var(--text-soft);
    }

    .theme-btn {
      flex-shrink: 0;
      width: 40px;
      height: 40px;
      display: grid;
      place-items: center;
      background: var(--chip);
      color: var(--text-soft);
      border-radius: 12px;
      transition: background .2s ease, color .2s ease, transform .2s ease;
    }

    .theme-btn:hover {
      background: var(--chip-hover);
      color: var(--text);
      transform: rotate(-15deg);
    }

    .theme-btn svg { width: 18px; height: 18px; }
    :root[data-theme="dark"] .theme-btn .icon-moon { display: none; }
    :root:not([data-theme="dark"]) .theme-btn .icon-sun { display: none; }

    .progress {
      height: 6px;
      border-radius: 99px;
      background: var(--chip);
      overflow: hidden;
      margin-bottom: 24px;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      border-radius: 99px;
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      transition: width .45s cubic-bezier(.22, 1, .36, 1);
    }

    .input-row {
      display: flex;
      gap: 10px;
      margin-bottom: 22px;
    }

    #todoInput {
      flex: 1;
      min-width: 0;
      padding: 14px 16px;
      background: var(--field);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      font: inherit;
      font-size: 15px;
      color: var(--text);
      outline: none;
      transition: border-color .2s ease, box-shadow .2s ease;
    }

    #todoInput::placeholder { color: var(--text-faint); }

    #todoInput:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 4px var(--accent-soft);
    }

    button {
      border: none;
      cursor: pointer;
      border-radius: 12px;
      font: inherit;
    }

    .add-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 0 20px;
      background: linear-gradient(120deg, var(--accent), var(--accent-2));
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      border-radius: 14px;
      box-shadow: 0 8px 20px -8px var(--accent);
      transition: transform .18s ease, box-shadow .18s ease, filter .18s ease;
    }

    .add-btn svg { width: 16px; height: 16px; }

    .add-btn:hover {
      transform: translateY(-1px);
      filter: brightness(1.06);
      box-shadow: 0 12px 24px -8px var(--accent);
    }

    .add-btn:active { transform: translateY(0); }

    .filters {
      display: flex;
      gap: 8px;
      margin-bottom: 8px;
    }

    .filter-btn {
      padding: 8px 15px;
      background: transparent;
      color: var(--text-soft);
      font-size: 14px;
      font-weight: 500;
      transition: background .2s ease, color .2s ease;
    }

    .filter-btn:hover {
      background: var(--chip);
      color: var(--text);
    }

    .filter-btn.active {
      background: var(--accent-soft);
      color: var(--accent);
      font-weight: 600;
    }

    .count-badge {
      display: inline-block;
      min-width: 20px;
      margin-left: 6px;
      padding: 1px 6px;
      border-radius: 99px;
      background: var(--chip);
      color: var(--text-faint);
      font-size: 11.5px;
      font-weight: 600;
      line-height: 1.5;
      transition: background .2s ease, color .2s ease;
    }

    .filter-btn.active .count-badge {
      background: var(--accent);
      color: #fff;
    }

    #todoList { list-style: none; }

    .todo-item {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px 12px;
      margin: 0 -12px;
      border-radius: 14px;
      border-bottom: 1px solid var(--line);
      transition: background .2s ease;
      animation: slide-in .28s ease both;
    }

    @keyframes slide-in {
      from { opacity: 0; transform: translateX(-8px); }
      to   { opacity: 1; transform: none; }
    }

    .todo-item:hover { background: var(--chip); }
    .todo-item:last-child { border-bottom: none; }

    .todo-item.removing {
      opacity: 0;
      transform: translateX(24px);
      transition: opacity .2s ease, transform .2s ease;
    }

    .edit-input {
      flex: 1;
      min-width: 0;
      padding: 8px 12px;
      background: var(--field);
      border: 1px solid var(--accent);
      border-radius: 10px;
      box-shadow: 0 0 0 4px var(--accent-soft);
      font: inherit;
      font-size: 15px;
      color: var(--text);
      outline: none;
    }

    .check {
      position: relative;
      flex-shrink: 0;
      width: 22px;
      height: 22px;
      display: grid;
      place-items: center;
    }

    .check input {
      position: absolute;
      inset: 0;
      opacity: 0;
      margin: 0;
      cursor: pointer;
      z-index: 2;
    }

    .check .box {
      width: 22px;
      height: 22px;
      border: 2px solid var(--text-faint);
      border-radius: 8px;
      display: grid;
      place-items: center;
      transition: background .2s ease, border-color .2s ease, transform .15s ease;
    }

    .check .box svg {
      width: 12px;
      height: 12px;
      color: #fff;
      opacity: 0;
      transform: scale(.4);
      transition: opacity .18s ease, transform .18s ease;
    }

    .check input:hover + .box { border-color: var(--accent); }

    .check input:checked + .box {
      background: linear-gradient(120deg, var(--accent), var(--accent-2));
      border-color: transparent;
    }

    .check input:checked + .box svg { opacity: 1; transform: scale(1); }

    .check input:focus-visible + .box { box-shadow: 0 0 0 4px var(--accent-soft); }

    .todo-text {
      flex: 1;
      font-size: 15px;
      line-height: 1.45;
      word-break: break-word;
      transition: color .2s ease, opacity .2s ease;
    }

    .todo-item.completed .todo-text {
      text-decoration: line-through;
      text-decoration-color: var(--text-faint);
      color: var(--text-faint);
    }

    .delete-btn {
      flex-shrink: 0;
      width: 32px;
      height: 32px;
      display: grid;
      place-items: center;
      background: transparent;
      color: var(--text-faint);
      opacity: 0;
      transition: opacity .2s ease, background .2s ease, color .2s ease;
    }

    .delete-btn svg { width: 16px; height: 16px; }

    .todo-item:hover .delete-btn,
    .delete-btn:focus-visible { opacity: 1; }

    .delete-btn:hover {
      background: var(--danger-soft);
      color: var(--danger);
    }

    .empty {
      text-align: center;
      color: var(--text-faint);
      padding: 44px 0 36px;
      font-size: 14px;
    }

    .empty svg {
      width: 40px;
      height: 40px;
      margin-bottom: 12px;
      opacity: .5;
    }

    .footer {
      margin-top: 18px;
      padding-top: 16px;
      border-top: 1px solid var(--line);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      color: var(--text-soft);
      font-size: 13.5px;
    }

    .clear-btn {
      padding: 7px 12px;
      background: transparent;
      color: var(--text-soft);
      font-size: 13.5px;
      font-weight: 500;
      transition: background .2s ease, color .2s ease;
    }

    .clear-btn:hover {
      background: var(--danger-soft);
      color: var(--danger);
    }

    @media (max-width: 520px) {
      body { padding: 28px 14px; }

      .todo-app {
        padding: 24px 20px 20px;
        border-radius: 18px;
      }

      h1 { font-size: 25px; }

      .input-row { flex-direction: column; }

      .add-btn {
        padding: 13px;
        justify-content: center;
      }

      .filter-btn { flex: 1; padding: 8px 10px; }
      .delete-btn { opacity: 1; }
    }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; }
    }
  </style>
</head>

<body>

  <div class="todo-app">
    <div class="head">
      <div>
        <h1>My Todo List</h1>
        <p class="subtitle" id="subtitle">Let's get things done.</p>
      </div>

      <button class="theme-btn" onclick="toggleTheme()" aria-label="Toggle dark mode" title="Toggle theme">
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
        </svg>
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="4"></circle>
          <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"></path>
        </svg>
      </button>
    </div>

    <div class="progress">
      <div class="progress-bar" id="progressBar"></div>
    </div>

    <div class="input-row">
      <input
        type="text"
        id="todoInput"
        placeholder="What needs to be done?"
      >
      <button class="add-btn" onclick="addTodo()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 5v14M5 12h14"></path>
        </svg>
        Add
      </button>
    </div>

    <div class="filters">
      <button class="filter-btn active" onclick="setFilter('all', this)">
        All <span class="count-badge" id="countAll">0</span>
      </button>
      <button class="filter-btn" onclick="setFilter('active', this)">
        Active <span class="count-badge" id="countActive">0</span>
      </button>
      <button class="filter-btn" onclick="setFilter('completed', this)">
        Completed <span class="count-badge" id="countCompleted">0</span>
      </button>
    </div>

    <ul id="todoList"></ul>

    <div class="footer">
      <span id="todoCount">0 tasks</span>
      <button class="clear-btn" onclick="clearCompleted()">
        Clear completed
      </button>
    </div>
  </div>

  <script>
    let todos = JSON.parse(localStorage.getItem("todos")) || [];
    let currentFilter = "all";

    const input = document.getElementById("todoInput");
    const list = document.getElementById("todoList");
    const count = document.getElementById("todoCount");
    const progressBar = document.getElementById("progressBar");
    const subtitle = document.getElementById("subtitle");

    function saveTodos() {
      localStorage.setItem("todos", JSON.stringify(todos));
    }

    function toggleTheme() {
      const isDark = document.documentElement.dataset.theme === "dark";
      const next = isDark ? "light" : "dark";

      document.documentElement.dataset.theme = next;
      localStorage.setItem("theme", next);
    }

    function initTheme() {
      const saved = localStorage.getItem("theme");
      const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;

      document.documentElement.dataset.theme =
        saved || (prefersDark ? "dark" : "light");
    }

    function addTodo() {
      const text = input.value.trim();

      if (!text) {
        input.focus();
        return;
      }

      todos.push({
        id: Date.now(),
        text: text,
        completed: false
      });

      input.value = "";
      input.focus();
      saveTodos();
      renderTodos();
    }

    input.addEventListener("keydown", function(event) {
      if (event.key === "Enter") {
        addTodo();
      }
    });

    function toggleTodo(id) {
      todos = todos.map(todo =>
        todo.id === id
          ? { ...todo, completed: !todo.completed }
          : todo
      );

      saveTodos();
      renderTodos();
    }

    function removeTodo(id) {
      todos = todos.filter(todo => todo.id !== id);

      saveTodos();
      renderTodos();
    }

    function deleteTodo(id, button) {
      const row = button && button.closest(".todo-item");
      const reduceMotion =
        window.matchMedia("(prefers-reduced-motion: reduce)").matches;

      if (!row || reduceMotion) {
        removeTodo(id);
        return;
      }

      row.classList.add("removing");
      setTimeout(() => removeTodo(id), 200);
    }

    function startEdit(id, span) {
      const todo = todos.find(item => item.id === id);

      if (!todo || todo.completed) return;

      const field = document.createElement("input");
      field.type = "text";
      field.className = "edit-input";
      field.value = todo.text;

      span.replaceWith(field);
      field.focus();
      field.setSelectionRange(field.value.length, field.value.length);

      let settled = false;

      function commit() {
        if (settled) return;
        settled = true;

        const text = field.value.trim();

        if (text) {
          todo.text = text;
          saveTodos();
        }

        renderTodos();
      }

      field.addEventListener("blur", commit);

      field.addEventListener("keydown", event => {
        if (event.key === "Enter") {
          commit();
        }

        if (event.key === "Escape") {
          settled = true;
          renderTodos();
        }
      });
    }

    function clearCompleted() {
      todos = todos.filter(todo => !todo.completed);

      saveTodos();
      renderTodos();
    }

    function setFilter(filter, button) {
      currentFilter = filter;

      document.querySelectorAll(".filter-btn").forEach(btn => {
        btn.classList.remove("active");
      });

      button.classList.add("active");

      renderTodos();
    }

    const EMPTY_STATES = {
      all: "Nothing here yet — add your first task above.",
      active: "All caught up. Nice work!",
      completed: "No completed tasks yet."
    };

    function renderTodos() {
      list.innerHTML = "";

      let filteredTodos = todos;

      if (currentFilter === "active") {
        filteredTodos = todos.filter(todo => !todo.completed);
      }

      if (currentFilter === "completed") {
        filteredTodos = todos.filter(todo => todo.completed);
      }

      if (filteredTodos.length === 0) {
        list.innerHTML = `
          <li class="empty">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"
                 stroke-linecap="round" stroke-linejoin="round">
              <path d="M9 11l3 3L22 4"></path>
              <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path>
            </svg>
            <div>${EMPTY_STATES[currentFilter]}</div>
          </li>
        `;
      } else {
        filteredTodos.forEach(todo => {
          const li = document.createElement("li");
          li.className = "todo-item";

          if (todo.completed) {
            li.classList.add("completed");
          }

          li.innerHTML = `
            <label class="check">
              <input
                type="checkbox"
                ${todo.completed ? "checked" : ""}
                onchange="toggleTodo(${todo.id})"
              >
              <span class="box">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5"
                     stroke-linecap="round" stroke-linejoin="round">
                  <path d="M20 6L9 17l-5-5"></path>
                </svg>
              </span>
            </label>

            <span
              class="todo-text"
              ondblclick="startEdit(${todo.id}, this)"
              title="Double-click to edit"
            >${escapeHTML(todo.text)}</span>

            <button
              class="delete-btn"
              onclick="deleteTodo(${todo.id}, this)"
              aria-label="Delete task"
              title="Delete"
            >
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                   stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 6h18M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2m2 0v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"></path>
                <path d="M10 11v6M14 11v6"></path>
              </svg>
            </button>
          `;

          list.appendChild(li);
        });
      }

      const activeCount = todos.filter(todo => !todo.completed).length;
      const doneCount = todos.length - activeCount;

      document.getElementById("countAll").textContent = todos.length;
      document.getElementById("countActive").textContent = activeCount;
      document.getElementById("countCompleted").textContent = doneCount;

      count.textContent =
        activeCount === 1
          ? "1 task remaining"
          : `${activeCount} tasks remaining`;

      progressBar.style.width =
        todos.length === 0 ? "0%" : `${(doneCount / todos.length) * 100}%`;

      subtitle.textContent =
        todos.length === 0
          ? "Let's get things done."
          : activeCount === 0
            ? "Everything's done — enjoy the day!"
            : `${doneCount} of ${todos.length} complete`;
    }

    function escapeHTML(text) {
      const div = document.createElement("div");
      div.textContent = text;
      return div.innerHTML;
    }

    initTheme();
    renderTodos();
  </script>

</body>
</html>
